<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TapeID · 一键领取</title>
<meta name="description" content="把 IGNIX 金库分给你电路容器的交易税，一键结算、领取、转进钱包。">
<link rel="icon" href="./tapeid-default.png">
<style>
  :root {
    --bg:#f6f5f1; --card:#ffffff; --fg:#17181b; --dim:#6a6b70; --line:#e2e0da;
    --acc:#c98a12; --acc-fg:#ffffff; --acc-soft:#fbf1dc; --ok:#1f7a45; --bad:#b3261e; --focus:#2b62c9;
    --r:10px; --gap:14px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1116; --card:#161a21; --fg:#eceae4; --dim:#9a9ca3; --line:#2a2f38;
      --acc:#e8b04a; --acc-fg:#16130b; --acc-soft:#2b2412; --ok:#5cc184; --bad:#ff7a70; --focus:#7fa6ff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 -apple-system, "PingFang SC", "Noto Sans SC", system-ui, sans-serif; }
  main { max-width:720px; margin:0 auto; padding:20px 16px 80px; }
  header { display:flex; gap:12px; align-items:flex-start; }
  header img { width:56px; height:56px; border-radius:50%; flex:none; }
  h1 { font-size:24px; line-height:1.25; margin:2px 0 6px; }
  .lead { color:var(--dim); margin:0; }
  #lang { margin-left:auto; flex:none; }
  ol.dots { list-style:none; display:flex; gap:6px; padding:0; margin:18px 0; }
  ol.dots li { flex:1; height:4px; border-radius:2px; background:var(--line); }
  ol.dots li.done { background:var(--ok); } ol.dots li.now { background:var(--acc); }
  section { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-bottom:var(--gap); }
  section h2 { font-size:17px; margin:0 0 10px; display:flex; gap:8px; align-items:center; }
  section h2 .n { width:24px; height:24px; border-radius:50%; background:var(--acc); color:var(--acc-fg); font-size:13px; display:inline-grid; place-items:center; flex:none; }
  button, .btn { font:inherit; border-radius:8px; border:1px solid var(--acc); background:var(--acc); color:var(--acc-fg); padding:10px 18px; cursor:pointer; text-decoration:none; display:inline-block; text-align:center; }
  button.big, .btn.big { width:100%; padding:14px; font-size:17px; font-weight:600; }
  button.ghost { background:transparent; color:var(--fg); border-color:var(--line); padding:6px 12px; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  a { color:var(--acc); }
  .dim { color:var(--dim); } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:13px; word-break:break-all; }
  .note { background:var(--acc-soft); border-radius:8px; padding:10px 12px; margin-top:10px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input, textarea { width:100%; font:inherit; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
  textarea { min-height:90px; }
  label { display:block; font-weight:600; margin:12px 0 4px; }
  .hint { color:var(--dim); font-size:13px; margin:4px 0 0; }
  #circuits { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:8px; margin-top:10px; }
  @media (max-width:560px) { #circuits { grid-template-columns:1fr 1fr; } .circ .meta { font-size:12px; } }
  #pickerWrap.picked .circ:not(.on), #pickerWrap.picked #searchRow, #pickerWrap.picked #more { display:none !important; }
  #pickerWrap:not(.picked) #change { display:none; }
  .circ { text-align:left; background:var(--bg); color:var(--fg); border:1px solid var(--line); padding:10px 12px; display:flex; flex-direction:column; gap:2px; }
  .circ.on { border-color:var(--acc); box-shadow:0 0 0 2px var(--acc) inset; }
  .circ .tid { font-weight:700; font-size:16px; } .circ .nm { color:var(--acc); font-weight:600; } .circ .meta { color:var(--dim); font-size:12.5px; }
  .preview { display:flex; gap:14px; align-items:center; }
  .preview img { width:84px; height:84px; border-radius:50%; flex:none; background:var(--bg); object-fit:cover; }
  .preview .pn { font-size:20px; font-weight:700; } .preview .ps { color:var(--acc); font-weight:700; }
  ul.earn-list { margin:12px 0 0; padding-left:20px; }
  details { margin-top:14px; border-top:1px dashed var(--line); padding-top:10px; }
  summary { cursor:pointer; color:var(--dim); }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; max-height:260px; overflow:auto; font-size:12px; white-space:pre-wrap; word-break:break-all; }
  .chk { display:flex; gap:10px; align-items:center; padding:6px 0; }
  .chk::before { content:"…"; width:22px; height:22px; border-radius:50%; display:inline-grid; place-items:center; background:var(--line); color:var(--dim); font-size:13px; flex:none; }
  .chk.ok::before { content:"✓"; background:var(--ok); color:#fff; }
  .chk.bad::before { content:"!"; background:var(--bad); color:#fff; }
  .chk.bad span { color:var(--bad); }
  .earn { display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
  .earn .amt { font-weight:700; }
  .coinrow { width:100%; text-align:left; background:transparent; color:var(--fg); border:0; border-top:1px solid var(--line); border-radius:0; padding:10px 0; }
  .toast { position:fixed; left:50%; bottom:20px; transform:translate(-50%, 40px); opacity:0; transition:.2s; background:var(--fg); color:var(--bg);
    padding:10px 16px; border-radius:8px; max-width:calc(100% - 32px); pointer-events:none; }
  .toast.show { transform:translate(-50%, 0); opacity:1; } .toast.bad { background:var(--bad); color:#fff; } .toast.ok { background:var(--ok); color:#fff; }
  footer { color:var(--dim); font-size:12.5px; text-align:center; margin-top:24px; }
  [hidden] { display:none !important; }
  .row .head { font-size:17px; margin-bottom:6px; }
  .row table { width:100%; border-collapse:collapse; margin:4px 0 10px; } .row td { padding:3px 4px; border-bottom:1px solid var(--line); }
  ol.steps { margin:8px 0 10px; padding-left:20px; color:var(--dim); } ol.steps li.ok { color:var(--ok); }
</style>
</head>
<body>
<main>
  <header>
    <img src="./21-nand-driver.png" alt="">
    <div><h1 data-i="title"></h1><p class="lead" data-i="lead"></p></div>
    <button id="lang" class="ghost" type="button" data-i="lang"></button>
  </header>
  <section>
    <button id="connect" class="big" type="button" data-i="connect"></button>
    <p id="connected" class="mono" hidden></p>
    <div id="noWallet" class="note" hidden><p data-i="noWallet" style="margin:0"></p></div>
  </section>
  <p id="state" class="dim" hidden></p>
  <div id="none" class="note" hidden><p data-i="none" style="margin:0 0 8px"></p><a class="btn" href="./xlayer.html">TapeID · X Layer</a></div>
  <div id="rows"></div>
  <p class="hint" id="feeNote"></p>
  <p class="hint" id="safeNote"></p>
  <p><button id="refresh" class="ghost" type="button" data-i="refresh"></button></p>
  <footer>TapeID · X Layer · <a href="./xlayer.html">发币 / Launch</a> · 本页不含自有合约，每笔交易都由你的钱包签名 / no custom contracts, every transaction is signed by your wallet</footer>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="./claim.bundle.js"></script>
</body>
</html>
